# ═══════════════════════════════════════════════════════════
#  Config gitleaks pour stabledesk
# ═══════════════════════════════════════════════════════════

[extend]
# Repart du jeu de règles complet, on ne fait qu'ajouter une exception.
useDefault = true

[allowlist]
description = "Faux positif sur un commentaire de code"

# generic-api-key déclenche sur ce commentaire d'api.js :
#   // per-token detail: supply/velocity + 24h summary + ...
# Le mot « token » sert d'amorce à la règle, et « supply/velocity »
# a juste assez d'entropie pour passer le seuil. C'est de la prose.
#
# Ancré sur le texte plutôt que sur un numéro de ligne : un
# .gitleaksignore par empreinte casserait au premier ajout de
# ligne au-dessus.
#
# Même règle, deuxième amorce : les champs tokenMessenger / tokenMinter
# des contrats CCTP dans chains.js. La valeur capturée est une adresse
# EVM, publique par définition. Ancré sur la forme exacte (0x + 40 hex,
# rien d'autre) : une clé privée fait 64 hex et ne passe pas.
regexes = [
    '''supply/velocity''',
    '''^0x[0-9a-fA-F]{40}$''',
]
