<style>
  :root{
    --bg:#0B0F14; --panel:#121820; --inset:#0E141B; --ink:#E9EEF4; --ink-2:#9AA6B3; --ink-3:#697583;
    --line:#212B36; --line-2:#2B3742; --accent:#25C4B8; --good:#37C98A; --warn:#E7A93A;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:light){:root{
    --bg:#EEF1F5; --panel:#FFFFFF; --inset:#EAEEF3; --ink:#101820; --ink-2:#55606E; --ink-3:#8B95A2;
    --line:#E1E6EC; --line-2:#D2DAE2; --accent:#0FA79E; --good:#128A5B; --warn:#B4791A;
  }}
  :root[data-theme="dark"]{--bg:#0B0F14; --panel:#121820; --inset:#0E141B; --ink:#E9EEF4; --ink-2:#9AA6B3; --ink-3:#697583; --line:#212B36; --line-2:#2B3742; --accent:#25C4B8; --good:#37C98A; --warn:#E7A93A}
  :root[data-theme="light"]{--bg:#EEF1F5; --panel:#FFFFFF; --inset:#EAEEF3; --ink:#101820; --ink-2:#55606E; --ink-3:#8B95A2; --line:#E1E6EC; --line-2:#D2DAE2; --accent:#0FA79E; --good:#128A5B; --warn:#B4791A}
  .iconbtn{display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:8px; border:1px solid var(--line-2); background:var(--panel); color:var(--ink-2); cursor:pointer; padding:0}
  .iconbtn:hover{color:var(--ink); border-color:var(--ink-3)} .iconbtn svg{width:16px; height:16px; display:block}
  *{box-sizing:border-box}
  body{margin:0; font-family:var(--sans); background:var(--bg); color:var(--ink); line-height:1.65; -webkit-font-smoothing:antialiased}
  .wrap{max-width:820px; margin:0 auto; padding:clamp(18px,4vw,44px)}
  a{color:var(--accent)}
  .crumb{font-size:13px; margin:0 0 14px} .crumb a{color:var(--ink-3); text-decoration:none} .crumb a:hover{color:var(--ink)}
  .top{display:flex; align-items:center; gap:11px; margin-bottom:8px}
  .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#9B7EDE);flex:none;position:relative}
  .logo::after{content:"";position:absolute;inset:7px;border:2.4px solid #fff;border-right-color:transparent;border-radius:4px;transform:rotate(-45deg)}
  h1{font-size:clamp(22px,3.4vw,28px); margin:0; letter-spacing:-.02em}
  .sub{color:var(--ink-2); margin:2px 0 26px; font-size:15px}
  .badge{display:inline-block; font-family:var(--mono); font-size:11.5px; color:var(--ink); background:var(--inset); border:1px solid var(--line-2); border-radius:6px; padding:1px 7px; margin-right:6px}
  h2{font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); margin:30px 0 10px; font-weight:650}
  h3{font-size:17px; margin:2px 0 6px; letter-spacing:-.01em} h3 a{color:var(--ink); text-decoration:none} h3 a:hover{color:var(--accent)}
  p{color:var(--ink-2)} strong{color:var(--ink)}
  code{font-family:var(--mono); font-size:.9em; background:var(--inset); padding:1px 6px; border-radius:5px; border:1px solid var(--line); color:var(--ink); overflow-wrap:anywhere}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin:0 0 14px}
  .card > p:last-child{margin-bottom:0}
  .kicker{font-family:var(--mono); font-size:11.5px; color:var(--ink-3); margin:0; letter-spacing:.02em}
  .lead{border-left:3px solid var(--accent); padding-left:14px; margin:0 0 8px; color:var(--ink); font-size:16.5px}
  .tbl{overflow-x:auto; margin:0 0 6px}
  table{width:100%; border-collapse:collapse; font-size:13.5px; margin:4px 0}
  th,td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; white-space:nowrap}
  th{font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3)}
  td:first-child{font-weight:600; color:var(--ink)}
  .num{text-align:right; font-family:var(--mono); font-size:12.5px; font-variant-numeric:tabular-nums}
  /* On a phone the net column is the point of each table, so the tables shrink to fit rather than scroll it out of view. */
  @media (max-width:520px){
    .card{padding:14px 12px}
    th,td{padding:8px 5px} th{font-size:9.5px; letter-spacing:.03em}
    td:first-child{white-space:normal; font-size:12.5px}
    .num{font-size:11.5px}
  }
  .note{background:color-mix(in srgb,var(--warn) 12%,transparent); border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line)); border-radius:10px; padding:12px 15px; font-size:13.5px; color:var(--ink-2)}
  .site-foot{margin-top:34px; border-top:1px solid var(--line); padding-top:16px; font-size:12px; color:var(--ink-3)}
  .sf-cols{display:flex; flex-wrap:wrap; gap:10px 24px; align-items:center; justify-content:space-between}
  .sf-brand{display:flex; align-items:center; gap:8px; font-weight:700; color:var(--ink-2); letter-spacing:.02em}
  .sf-logo{width:16px; height:16px; border-radius:5px; background:linear-gradient(135deg,var(--accent),#9B7EDE); flex:none}
  .sf-links{display:flex; flex-wrap:wrap; gap:8px 18px}
  .sf-links a{color:var(--ink-2); text-decoration:none} .sf-links a:hover{color:var(--ink)}
  .sf-legal{margin-top:12px; font-family:var(--mono); font-size:11px; color:var(--ink-3); line-height:1.6}
  .beta-dot{font-size:8.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--warn); border:1px solid color-mix(in srgb,var(--warn) 40%,transparent); border-radius:4px; padding:1px 4px; margin-left:4px; vertical-align:1px}
</style>
<script src="/theme.js"></script>

      </nav>

  </footer>
</div>
</body>
