<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stabledesk · Status</title>
<meta name="description" content="Live status of the Stabledesk indexer and API — current block, index lag, last check.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://stabledesk.xyz/status">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230FA79E'/%3E%3Cstop offset='.5' stop-color='%2325C4B8'/%3E%3Cstop offset='1' stop-color='%239B7EDE'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M22 10L10 10L10 22L22 22' fill='none' stroke='%23fff' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round' transform='rotate(-45 16 16)'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0B0F14; --panel:#121820; --inset:#0E141B; --ink:#E9EEF4; --ink-2:#9AA6B3; --ink-3:#697583;
    --line:#212B36; --line-2:#2B3742; --accent:#25C4B8; --good:#37C98A; --warn:#E7A93A; --bad:#E5686A;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 40px rgba(0,0,0,.28);
  }
  @media (prefers-color-scheme:light){:root{
    --bg:#EEF1F5; --panel:#FFFFFF; --inset:#EAEEF3; --ink:#101820; --ink-2:#55606E; --ink-3:#8B95A2;
    --line:#E1E6EC; --line-2:#D2DAE2; --accent:#0FA79E; --good:#128A5B; --warn:#B4791A; --bad:#D2494B;
    --shadow:0 1px 2px rgba(16,24,33,.05),0 12px 34px rgba(16,24,33,.08);
  }}
  :root[data-theme="dark"]{
    --bg:#0B0F14; --panel:#121820; --inset:#0E141B; --ink:#E9EEF4; --ink-2:#9AA6B3; --ink-3:#697583;
    --line:#212B36; --line-2:#2B3742; --accent:#25C4B8; --good:#37C98A; --warn:#E7A93A; --bad:#E5686A;
  }
  :root[data-theme="light"]{
    --bg:#EEF1F5; --panel:#FFFFFF; --inset:#EAEEF3; --ink:#101820; --ink-2:#55606E; --ink-3:#8B95A2;
    --line:#E1E6EC; --line-2:#D2DAE2; --accent:#0FA79E; --good:#128A5B; --warn:#B4791A; --bad:#D2494B;
  }
  *{box-sizing:border-box}
  body{margin:0; font-family:var(--sans); background:var(--bg); color:var(--ink); line-height:1.6; -webkit-font-smoothing:antialiased}
  .wrap{max-width:640px; margin:0 auto; padding:clamp(18px,4vw,44px)}
  .top{display:flex; align-items:center; gap:11px; margin-bottom:28px}
  .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#9B7EDE);flex:none}
  h1{font-size:clamp(20px,3vw,24px); margin:0; letter-spacing:-.02em}
  .iconbtn{display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:8px; border:1px solid var(--line-2); background:var(--panel); color:var(--ink-2); cursor:pointer; padding:0; margin-left:auto}
  .iconbtn:hover{color:var(--ink); border-color:var(--ink-3)}
  .iconbtn svg{width:16px; height:16px; display:block}

  .banner{display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 20px; box-shadow:var(--shadow); margin-bottom:16px}
  .dot{width:12px; height:12px; border-radius:50%; flex:none; background:var(--ink-3)}
  .dot.good{background:var(--good); box-shadow:0 0 0 0 rgba(55,201,138,.5); animation:pulse 2s infinite}
  .dot.warn{background:var(--warn)}
  .dot.bad{background:var(--bad)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,201,138,.45)}70%{box-shadow:0 0 0 8px rgba(55,201,138,0)}100%{box-shadow:0 0 0 0 rgba(55,201,138,0)}}
  .banner .t1{font-size:16px; font-weight:650}
  .banner .t2{font-size:12.5px; color:var(--ink-3); margin-top:2px}

  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:16px}
  .kpi{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow)}
  .kpi .lab{font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); font-weight:600; margin-bottom:7px}
  .kpi .val{font-family:var(--mono); font-size:19px; font-weight:600; font-variant-numeric:tabular-nums}

  .errbox{background:color-mix(in srgb,var(--bad) 10%,var(--panel)); border:1px solid color-mix(in srgb,var(--bad) 35%,var(--line)); border-radius:12px; padding:14px 16px; font-family:var(--mono); font-size:12.5px; color:var(--ink); margin-bottom:16px; display:none}

  .site-foot{margin-top:26px; border-top:1px solid var(--line); padding-top:16px; font-size:12px; color:var(--ink-3)}
  .sf-cols{display:flex; flex-wrap:wrap; gap:10px 24px; align-items:center; justify-content:space-between}
  .sf-brand{display:flex; align-items:center; gap:8px; font-weight:700; color:var(--ink-2); letter-spacing:.02em}
  .sf-logo{width:16px; height:16px; border-radius:5px; background:linear-gradient(135deg,var(--accent),#9B7EDE); flex:none}
  .sf-links{display:flex; flex-wrap:wrap; gap:8px 18px}
  .sf-links a{color:var(--ink-2); text-decoration:none}
  .sf-links a:hover{color:var(--ink)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  /* beta marker on the footer link to the experimental Entities page */
  .beta-dot{font-size:8.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--warn); border:1px solid color-mix(in srgb,var(--warn) 40%,transparent); border-radius:4px; padding:1px 4px; margin-left:4px; vertical-align:1px}
</style>
<script src="/theme.js"></script>
<script defer src="https://cloud.umami.is/script.js" data-website-id="2f5d5bca-9ebd-4b1a-aded-b503e2939270"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo"></div>
    <h1>Stabledesk Status</h1>
    <button class="iconbtn" id="themeBtn" type="button" aria-label="Theme"></button>
  </div>

  <div class="banner">
    <span class="dot" id="dot"></span>
    <div>
      <div class="t1" id="headline">Checking…</div>
      <div class="t2" id="subline">Contacting the API</div>
    </div>
  </div>

  <div class="errbox" id="errbox"></div>

  <div class="grid">
    <div class="kpi"><div class="lab">Chain</div><div class="val">{{NET}} · {{CHAIN_ID}}</div></div>
    <div class="kpi"><div class="lab">Chain state</div><div class="val" id="chainState">—</div></div>
    <div class="kpi"><div class="lab" id="blockLab">Current block</div><div class="val" id="block">—</div></div>
    <div class="kpi"><div class="lab">Index lag</div><div class="val" id="lag">—</div></div>
    <div class="kpi"><div class="lab">Data as of</div><div class="val" id="dataAge">—</div></div>
    <div class="kpi"><div class="lab">Last checked</div><div class="val" id="checked">—</div></div>
  </div>

  <footer class="site-foot">
    <div class="sf-cols">
      <div class="sf-brand"><span class="sf-logo"></span> Stabledesk</div>
      <nav class="sf-links">
        <a href="/">Terminal</a>
        <a href="/ecosystem">Ecosystem</a>
        <a href="/docs">API</a>
        <a href="/methodology">Methodology</a>
        <a href="/status">Status</a>
        <a href="/entities">Entities <span class="beta-dot">beta</span></a>
        <a href="https://x.com/getStabledesk">@getStabledesk</a>
      </nav>
    </div>
  </footer>
</div>

<script>
const $ = (s) => document.querySelector(s);
const nf = new Intl.NumberFormat('en-US');
// Ages here are now measured against a chain that can be halted for hours, so seconds alone
// stopped being readable.
function dur(ms){
  const s = Math.max(0, Math.round(ms/1000));
  if (s < 60) return s + 's';
  if (s < 3600) return Math.round(s/60) + ' min';
  if (s < 86400) return (s/3600).toFixed(s < 7200 ? 1 : 0) + ' h';
  return (s/86400).toFixed(s < 172800 ? 1 : 0) + ' d';
}
function ago(ts){ const s = Math.max(0, Math.round((Date.now()-ts)/1000)); return s<2?'just now':dur(Date.now()-ts)+' ago'; }

async function poll(){
  try{
    const r = await fetch('/api/health', { cache: 'no-store' });
    const j = await r.json();
    const dot = $('#dot'), headline = $('#headline'), subline = $('#subline'), errbox = $('#errbox');

    // Two independent things can be wrong — the chain, or us — and the old page reported both
    // as "the indexer is not reporting healthy data", taking the blame for upstream outages.
    // Chain state is checked first because it explains our state, not the other way round.
    const c = j.chain || {};

    if (c.state === 'halted') {
      dot.className = 'dot warn';
      headline.textContent = 'Arc has stopped producing blocks';
      subline.textContent = 'The chain is halted' + (c.head != null ? ' at #' + nf.format(c.head) : '')
        + (c.stalledMs ? ' — no new block for ' + dur(c.stalledMs) : '')
        + '. Stabledesk is up and serving the history it indexed.';
    } else if (c.state === 'unauthorized') {
      // The one chain-side symptom that is actually our fault, so it gets the red dot: every
      // endpoint answered and refused our credentials. Reported as an outage, this reads as
      // "wait for Arc" — and nobody goes and looks at the key.
      dot.className = 'dot bad';
      headline.textContent = 'RPC access is being rejected';
      subline.textContent = 'Arc is answering but refusing our credentials'
        + (c.lastError ? ' (' + c.lastError + ')' : '')
        + '. This is a configuration problem on our side, not a chain outage. Serving indexed history'
        + (j.dataAt ? ', frozen at ' + ago(j.dataAt) : '') + '.';
    } else if (c.state === 'unreachable') {
      dot.className = 'dot warn';
      headline.textContent = 'Arc is unreachable';
      subline.textContent = 'No RPC endpoint is answering. Stabledesk is up and serving the history it indexed'
        + (j.dataAt ? ', frozen at ' + ago(j.dataAt) : '') + '.';
    } else if (j.booting) {
      dot.className = 'dot warn';
      headline.textContent = 'Indexing';
      subline.textContent = 'Building the first pass of history — figures appear as blocks are read.';
    } else if (!j.ok) {
      dot.className = 'dot bad';
      headline.textContent = 'Down';
      subline.textContent = 'The indexer is not reporting healthy data right now.';
    } else if (j.degraded || j.stale) {
      dot.className = 'dot warn';
      // The chain is producing blocks and we are behind it — a backfill, or catching up after a
      // restart. Distinct from both failure modes above, and it resolves on its own.
      headline.textContent = c.state === 'live' ? 'Catching up' : 'Degraded';
      subline.textContent = c.state === 'live'
        ? 'The chain is healthy; the index is reading its way to the head.'
        : 'Serving the last known good data — a fresh update is delayed.';
    } else {
      dot.className = 'dot good';
      headline.textContent = 'All systems operational';
      subline.textContent = 'Live and fully caught up with the chain.';
    }

    const frozen = c.state === 'halted' || c.state === 'unreachable' || c.state === 'unauthorized';
    // Whenever we are serving indexed history the figure is the last block we read, not the head
    // of the chain — and while catching up those are millions of blocks apart.
    $('#block').textContent = j.block != null ? '#' + nf.format(j.block) : '—';
    $('#blockLab').textContent = j.degraded ? 'Last indexed block' : 'Current block';

    // Behind the head by however far the chain has run ahead of us. The indexer only publishes
    // indexLag on a completed poll, so during a backfill it is derived from the two block numbers.
    const lag = j.indexLag != null ? j.indexLag
      : (c.head != null && j.block != null ? Math.max(0, c.head - j.block) : null);
    $('#lag').textContent = frozen ? '—'
      : lag == null ? '—'
      : lag === 0 ? 'Caught up' : nf.format(lag) + ' blocks';
    $('#chainState').textContent = c.state === 'live' ? 'Producing blocks'
      : c.state === 'halted' ? 'Halted'
      : c.state === 'unauthorized' ? 'Refusing our key'
      : c.state === 'unreachable' ? 'Unreachable' : '—';
    $('#dataAge').textContent = j.dataAt ? ago(j.dataAt) : '—';
    $('#checked').textContent = ago(Date.now());

    // Kept visible — the raw error is the point of a status page — but attributed, so a chain-side
    // failure isn't read as ours just because we are the one reporting it.
    const err = c.lastError || j.lastError;
    if (err) {
      errbox.style.display = 'block';
      errbox.textContent = (c.state === 'unauthorized' ? 'rpc auth: ' : frozen ? 'chain rpc: ' : 'indexer: ') + err;
    } else { errbox.style.display = 'none'; }
  } catch (e) {
    $('#dot').className = 'dot bad';
    $('#headline').textContent = 'Unreachable';
    $('#subline').textContent = 'Could not reach the API from your browser.';
  }
}
poll();
setInterval(poll, 5000);
</script>
</body>
</html>
