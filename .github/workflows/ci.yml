name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 24.x is what the Dockerfile actually runs, so it has to be in here — the matrix used to
        # cover only 22/23 and therefore never tested the version in production. It is also where
        # node:sqlite stops being experimental. 22.x stays because it is the floor in `engines`.
        node-version: [22.x, 23.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run unit tests
        run: npm test
